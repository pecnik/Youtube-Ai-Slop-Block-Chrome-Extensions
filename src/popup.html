<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                width: 300px;
                margin: 0;
                padding: 12px;
                font: 13px system-ui, sans-serif;
                background: #181818;
                color: #eee;
            }
            h1 {
                font-size: 15px;
                margin: 0 0 10px;
            }
            ul {
                list-style: none;
                margin: 0;
                padding: 0;
                max-height: 400px;
                overflow-y: auto;
            }
            li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                padding: 6px 2px;
                border-bottom: 1px solid #2a2a2a;
            }
            a {
                color: #eee;
                text-decoration: none;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            a:hover {
                text-decoration: underline;
            }
            button {
                flex: none;
                border: none;
                background: none;
                color: #888;
                cursor: pointer;
            }
            button:hover {
                color: #fff;
            }
            .option {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 10px;
                cursor: pointer;
            }
            .empty {
                color: #777;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>🚫 AI-Slop blacklist (<span id="count">0</span>)</h1>
        <label class="option"><input type="checkbox" id="show-blacklisted" /> Show blacklisted channels</label>
        <ul id="list"></ul>
        <script src="popup.js"></script>
    </body>
</html>
