<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                width: 300px;
                margin: 0;
                padding: 12px;
                font:
                    13px system-ui,
                    sans-serif;
                background: #181818;
                color: #eee;
            }
            hr {
                border-color: #222;
            }
            h1 {
                font-size: 15px;
                margin: 0 0 10px;
            }
            ul {
                list-style: none;
                margin: 0;
                padding: 0;
                max-height: 400px;
                overflow-y: auto;
            }
            li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                padding: 6px 2px;
                border-bottom: 1px solid #2a2a2a;
            }
            a {
                color: #eee;
                text-decoration: none;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            a:hover {
                text-decoration: underline;
            }
            button {
                flex: none;
                border: none;
                background: none;
                color: #888;
                cursor: pointer;
            }
            button:hover {
                color: #fff;
            }
            .option {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                cursor: pointer;
            }
            .switch {
                appearance: none;
                position: relative;
                flex: none;
                width: 34px;
                height: 18px;
                margin: 0;
                border-radius: 9px;
                background: #444;
                cursor: pointer;
                transition: background 0.15s;
            }
            .switch::before {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #eee;
                transition: transform 0.15s;
            }
            .switch:checked {
                background: #e53935;
            }
            .switch:checked::before {
                transform: translateX(16px);
            }
            .switch:focus-visible {
                outline: 2px solid #888;
                outline-offset: 2px;
            }
            .aislist {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                color: #aaa;
            }
            .stats {
                margin-bottom: 10px;
                color: #aaa;
            }
            #blocked-today {
                color: #e53935;
                font-weight: bold;
            }
            #aislist-status {
                white-space: pre-line;
            }
            .aislist button {
                padding: 3px 8px;
                border-radius: 4px;
                background: #333;
                color: #eee;
            }
            .aislist button:hover:not(:disabled) {
                background: #444;
            }
            .aislist button:disabled {
                color: #888;
                cursor: default;
            }
            .empty {
                color: #777;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <label class="option">
            Show blacklisted channels
            <input type="checkbox" id="show-blacklisted" class="switch" />
        </label>
        <hr />
        <div class="stats">Blocked <span id="blocked-today">0</span> today</div>
        <hr />
        <div class="aislist">
            <span id="aislist-status">AiSList: not synced yet</span>
            <button id="sync-aislist">Sync AiSList</button>
        </div>
        <hr />
        <h1>AI-Slop blacklist (<span id="count">0</span>)</h1>
        <ul id="list"></ul>
        <script src="popup.js"></script>
    </body>
</html>
